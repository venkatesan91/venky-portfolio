<section id="education" class="section bg-slate-50 dark:bg-black">
    <div class="container-custom">
        <div class="text-center mb-16 reveal">
            <h2 class="text-4xl md:text-5xl font-bold text-slate-900 dark:text-white mb-4">
                Education
            </h2>
            <div class="w-20 h-1 bg-primary-500 mx-auto rounded-full"></div>
        </div>

        <div class="grid md:grid-cols-2 gap-8 max-w-5xl mx-auto">
            <div *ngFor="let edu of education; let i = index"
                class="reveal bg-white dark:bg-slate-900 p-8 rounded-2xl shadow-lg border border-slate-100 dark:border-slate-800 hover:border-primary-500/50 transition-all duration-300 group"
                [style.transition-delay]="i * 100 + 'ms'">

                <div class="flex items-start justify-between mb-4">
                    <div
                        class="p-3 bg-primary-50 dark:bg-primary-900/20 rounded-xl group-hover:bg-primary-500 group-hover:text-white transition-colors duration-300 text-primary-600 dark:text-primary-400">
                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M12 14l9-5-9-5-9 5 9 5z" />
                            <path
                                d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222" />
                        </svg>
                    </div>
                    <span
                        class="px-3 py-1 text-sm font-medium text-slate-500 dark:text-slate-400 bg-slate-100 dark:bg-slate-800 rounded-full">
                        {{ edu.startDate }} - {{ edu.endDate }}
                    </span>
                </div>

                <h3
                    class="text-xl font-bold text-slate-900 dark:text-white mb-2 group-hover:text-primary-500 transition-colors">
                    {{ edu.institution }}
                </h3>

                <div class="text-lg font-medium text-slate-700 dark:text-slate-300 mb-2">
                    {{ edu.degree }} in {{ edu.field }}
                </div>

                <div class="flex items-center gap-2 text-slate-500 dark:text-slate-400 mb-4">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    {{ edu.location }}
                </div>

                <div *ngIf="edu.gpa"
                    class="inline-block px-3 py-1 text-sm font-semibold text-primary-600 dark:text-primary-400 bg-primary-50 dark:bg-primary-900/10 rounded-lg border border-primary-100 dark:border-primary-900/50">
                    GPA: {{ edu.gpa }}
                </div>
            </div>
        </div>
    </div>
</section>
