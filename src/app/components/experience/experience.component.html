<section id="experience" class="section bg-slate-50 dark:bg-slate-800">
    <div class="container-custom">
        <div class="text-center mb-16 reveal">
            <h2 class="text-4xl md:text-5xl font-bold text-slate-900 dark:text-white mb-4">
                Experience
            </h2>
            <div class="w-20 h-1 bg-primary-500 mx-auto rounded-full"></div>
        </div>

        <div class="max-w-4xl mx-auto">
            <!-- Timeline -->
            <div class="relative">
                <!-- Timeline line -->
                <div class="absolute left-8 md:left-1/2 top-0 bottom-0 w-0.5 bg-primary-500/30"></div>

                <!-- Experience items -->
                <div *ngFor="let exp of experiences; let i = index" class="relative mb-12 last:mb-0">

                    <!-- Timeline dot -->
                    <div class="absolute left-8 md:left-1/2 w-4 h-4 bg-primary-500 rounded-full transform -translate-x-1/2 mt-6 reveal"
                        [style.animation-delay]="(i * 0.1) + 's'"></div>

                    <!-- Content -->
                    <div class="ml-20 md:ml-0" [class.md:pr-[calc(50%+2rem)]]="i % 2 === 0"
                        [class.md:pl-[calc(50%+2rem)]]="i % 2 !== 0">

                        <div class="reveal bg-white dark:bg-slate-900 rounded-xl p-6 md:p-8 shadow-lg hover:shadow-xl transition-shadow card-hover"
                            [style.animation-delay]="(i * 0.1) + 's'">

                            <!-- Header -->
                            <div class="flex items-start justify-between flex-wrap gap-4 mb-4">
                                <div>
                                    <h3 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">
                                        {{ exp.role }}
                                    </h3>
                                    <div class="flex items-center gap-2 text-primary-500 font-semibold text-lg">
                                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                                        </svg>
                                        <span>{{ exp.company }}</span>
                                    </div>
                                </div>

                                <div class="text-sm text-slate-600 dark:text-slate-400 flex items-center gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                    </svg>
                                    <span>{{ formatDate(exp.startDate) }} - {{ formatDate(exp.endDate) }}</span>
                                </div>
                            </div>

                            <!-- Location -->
                            <div *ngIf="exp.location"
                                class="flex items-center gap-2 text-slate-600 dark:text-slate-400 mb-4">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                </svg>
                                <span class="text-sm">{{ exp.location }}</span>
                            </div>

                            <!-- Description -->
                            <p *ngIf="exp.description" class="text-slate-700 dark:text-slate-300 mb-4">
                                {{ exp.description }}
                            </p>

                            <!-- Responsibilities -->
                            <ul *ngIf="exp.responsibilities && exp.responsibilities.length > 0" class="space-y-2 mb-4">
                                <li *ngFor="let responsibility of exp.responsibilities"
                                    class="flex items-start gap-2 text-slate-700 dark:text-slate-300">
                                    <svg class="w-5 h-5 text-primary-500 flex-shrink-0 mt-0.5" fill="none"
                                        stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                                    </svg>
                                    <span class="text-sm">{{ responsibility }}</span>
                                </li>
                            </ul>

                            <!-- Technologies -->
                            <div *ngIf="exp.technologies && exp.technologies.length > 0" class="flex flex-wrap gap-2">
                                <span *ngFor="let tech of exp.technologies" class="tag">
                                    {{ tech }}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Empty state -->
            <div *ngIf="!experiences || experiences.length === 0"
                class="text-center py-12 text-slate-500 dark:text-slate-400">
                <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                </svg>
                <p>No experience data available</p>
            </div>
        </div>
    </div>
</section>
