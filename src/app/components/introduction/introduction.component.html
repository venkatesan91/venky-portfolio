<section id="introduction"
    class="min-h-screen flex items-center justify-center relative overflow-hidden bg-gradient-to-br from-slate-50 to-slate-100 dark:from-black dark:to-slate-950">

    <!-- Background decoration -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div class="absolute top-1/4 -right-32 w-96 h-96 bg-primary-500/5 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/4 -left-32 w-96 h-96 bg-primary-500/5 rounded-full blur-3xl"></div>
    </div>

    <div class="container-custom px-4 md:px-8 relative z-10">
        <div class="max-w-5xl mx-auto text-center space-y-8 animate-fade-in">

            <!-- Greeting -->
            <div class="inline-block animate-slide-down"
                style="animation-delay: 0.1s; opacity: 0; animation-fill-mode: forwards;">
                <span class="text-primary-500 font-medium tracking-wider uppercase text-sm md:text-base">
                    Hello, I am
                </span>
            </div>

            <!-- Name -->
            <h1 class="text-6xl md:text-8xl lg:text-9xl font-bold text-slate-900 dark:text-white leading-tight tracking-tight animate-slide-up"
                style="animation-delay: 0.2s; opacity: 0; animation-fill-mode: forwards;">
                {{ personalInfo?.name || 'Venkatesan Murali' }}
            </h1>

            <!-- Title -->
            <h2 class="text-2xl md:text-4xl lg:text-5xl font-light text-slate-600 dark:text-slate-300 animate-slide-up"
                style="animation-delay: 0.3s; opacity: 0; animation-fill-mode: forwards;">
                {{ personalInfo?.title || 'Senior Software Engineer' }}
            </h2>

            <!-- Summary -->
            <p class="text-lg md:text-xl text-slate-500 dark:text-slate-400 max-w-3xl mx-auto leading-relaxed animate-slide-up"
                style="animation-delay: 0.4s; opacity: 0; animation-fill-mode: forwards;">
                {{ personalInfo?.summary }}
            </p>

            <!-- Location & Contact -->
            <div class="flex flex-wrap items-center justify-center gap-6 text-slate-500 dark:text-slate-400 animate-slide-up"
                style="animation-delay: 0.5s; opacity: 0; animation-fill-mode: forwards;">
                <div *ngIf="personalInfo?.location" class="flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span>{{ personalInfo?.location }}</span>
                </div>
                <div *ngIf="personalInfo?.email" class="flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                            d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    <a [href]="'mailto:' + (personalInfo?.email || '')"
                        class="hover:text-primary-500 transition-colors">
                        {{ personalInfo?.email }}
                    </a>
                </div>
            </div>

            <!-- CTA Buttons -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-6 pt-8 animate-scale-in"
                style="animation-delay: 0.6s; opacity: 0; animation-fill-mode: forwards;">
                <button (click)="downloadResume()" class="btn-primary w-full sm:w-auto min-w-[160px]">
                    <span class="flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        Resume
                    </span>
                </button>
                <button (click)="scrollToProjects()" class="btn-secondary w-full sm:w-auto min-w-[160px]">
                    <span class="flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                        Projects
                    </span>
                </button>
            </div>

            <!-- Social Links -->
            <div *ngIf="social" class="flex items-center justify-center gap-8 pt-12 animate-scale-in"
                style="animation-delay: 0.7s; opacity: 0; animation-fill-mode: forwards;">
                <a *ngIf="social.github" [href]="social.github" target="_blank" rel="noopener noreferrer"
                    class="text-slate-400 hover:text-white hover:scale-110 transition-all duration-300"
                    aria-label="GitHub">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                        <path fill-rule="evenodd"
                            d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
                            clip-rule="evenodd" />
                    </svg>
                </a>
                <a *ngIf="social.linkedin" [href]="social.linkedin" target="_blank" rel="noopener noreferrer"
                    class="text-slate-400 hover:text-white hover:scale-110 transition-all duration-300"
                    aria-label="LinkedIn">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" />
                    </svg>
                </a>
                <a *ngIf="social.twitter" [href]="social.twitter" target="_blank" rel="noopener noreferrer"
                    class="text-slate-400 hover:text-white hover:scale-110 transition-all duration-300"
                    aria-label="Twitter">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24">
                        <path
                            d="M23.953 4.57a10 10 0 01-2.825.775 4.958 4.958 0 002.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 00-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 00-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 01-2.228-.616v.06a4.923 4.923 0 003.946 4.827 4.996 4.996 0 01-2.212.085 4.936 4.936 0 004.604 3.417 9.867 9.867 0 01-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 007.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63A9.935 9.935 0 0024 4.59z" />
                    </svg>
                </a>
            </div>

            <!-- Scroll indicator -->
            <div class="pt-16 animate-bounce">
                <svg class="w-6 h-6 mx-auto text-slate-500 dark:text-slate-600" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                </svg>
            </div>
        </div>
    </div>
</section>
