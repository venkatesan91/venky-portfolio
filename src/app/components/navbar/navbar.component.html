<nav [class.scrolled]="isScrolled" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300"
  [class.glass]="isScrolled" [class.bg-white]="!isScrolled && !isDarkMode" [class.dark:bg-slate-900]="!isScrolled">

  <div class="container-custom px-4 md:px-8">
    <div class="flex items-center justify-between h-16 md:h-20">

      <!-- Logo/Name -->
      <button (click)="scrollToSection('introduction')"
        class="text-xl md:text-2xl font-bold gradient-text hover:scale-105 transition-transform">
        <span class="hidden sm:inline">VM</span>
        <span class="sm:hidden">V</span>
      </button>

      <!-- Desktop Navigation -->
      <div class="hidden md:flex items-center space-x-8">
        <button (click)="scrollToSection('about')"
          class="nav-link text-slate-700 dark:text-slate-300 hover:text-primary-500 dark:hover:text-primary-400 font-medium transition-colors">
          About
        </button>
        <button (click)="scrollToSection('experience')"
          class="nav-link text-slate-700 dark:text-slate-300 hover:text-primary-500 dark:hover:text-primary-400 font-medium transition-colors">
          Experience
        </button>
        <button (click)="scrollToSection('education')"
          class="nav-link text-slate-700 dark:text-slate-300 hover:text-primary-500 dark:hover:text-primary-400 font-medium transition-colors">
          Education
        </button>
        <button (click)="scrollToSection('projects')"
          class="nav-link text-slate-700 dark:text-slate-300 hover:text-primary-500 dark:hover:text-primary-400 font-medium transition-colors">
          Projects
        </button>
        <button (click)="scrollToSection('skills')"
          class="nav-link text-slate-700 dark:text-slate-300 hover:text-primary-500 dark:hover:text-primary-400 font-medium transition-colors">
          Skills
        </button>
        <button (click)="scrollToSection('contact')"
          class="nav-link text-slate-700 dark:text-slate-300 hover:text-primary-500 dark:hover:text-primary-400 font-medium transition-colors">
          Contact
        </button>

        <!-- Theme Toggle -->
        <button (click)="toggleTheme()"
          class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" aria-label="Toggle theme">
          <svg *ngIf="!isDarkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <svg *ngIf="isDarkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>
      </div>

      <!-- Mobile Menu Button -->
      <button (click)="toggleMobileMenu()"
        class="md:hidden p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors"
        aria-label="Toggle menu">
        <svg *ngIf="!isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg *ngIf="isMobileMenuOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="isMobileMenuOpen"
    class="md:hidden bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-700 animate-slide-down">
    <div class="container-custom px-4 py-4 space-y-3">
      <button (click)="scrollToSection('about')"
        class="block w-full text-left px-4 py-3 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-medium transition-colors">
        About
      </button>
      <button (click)="scrollToSection('experience')"
        class="block w-full text-left px-4 py-3 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-medium transition-colors">
        Experience
      </button>
      <button (click)="scrollToSection('education')"
        class="block w-full text-left px-4 py-3 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-medium transition-colors">
        Education
      </button>
      <button (click)="scrollToSection('projects')"
        class="block w-full text-left px-4 py-3 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-medium transition-colors">
        Projects
      </button>
      <button (click)="scrollToSection('skills')"
        class="block w-full text-left px-4 py-3 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-medium transition-colors">
        Skills
      </button>
      <button (click)="scrollToSection('contact')"
        class="block w-full text-left px-4 py-3 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-medium transition-colors">
        Contact
      </button>
      <button (click)="toggleTheme()"
        class="flex items-center justify-between w-full px-4 py-3 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-medium transition-colors">
        <span>Theme</span>
        <span class="text-sm text-slate-500">{{ isDarkMode ? 'Dark' : 'Light' }}</span>
      </button>
    </div>
  </div>
</nav>

<!-- Spacer to prevent content from going under fixed navbar -->
<div class="h-16 md:h-20"></div>
