<section id="projects" class="section bg-white dark:bg-slate-900">
    <div class="container-custom">
        <div class="text-center mb-16 reveal">
            <h2 class="text-4xl md:text-5xl font-bold text-slate-900 dark:text-white mb-4">
                Projects
            </h2>
            <div class="w-20 h-1 bg-primary-500 mx-auto rounded-full"></div>
            <p class="mt-4 text-lg text-slate-600 dark:text-slate-400 max-w-2xl mx-auto">
                Here are some of the projects I've worked on
            </p>
        </div>

        <!-- Projects Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div *ngFor="let project of projects; let i = index"
                class="reveal bg-slate-50 dark:bg-slate-800 rounded-xl overflow-hidden shadow-lg card-hover group"
                [style.animation-delay]="(i * 0.1) + 's'">

                <!-- Project Image -->
                <div class="relative h-48 bg-gradient-to-br from-primary-400 to-primary-600 overflow-hidden">
                    <img *ngIf="project.image" [src]="project.image" [alt]="project.title"
                        class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">

                    <!-- Placeholder if no image -->
                    <div *ngIf="!project.image" class="w-full h-full flex items-center justify-center">
                        <svg class="w-20 h-20 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </div>

                    <!-- Featured badge -->
                    <div *ngIf="project.featured"
                        class="absolute top-4 right-4 px-3 py-1 bg-white/90 dark:bg-slate-900/90 backdrop-blur-sm rounded-full text-xs font-semibold text-primary-500">
                        Featured
                    </div>
                </div>

                <!-- Project Content -->
                <div class="p-6 space-y-4">
                    <div>
                        <h3
                            class="text-xl font-bold text-slate-900 dark:text-white mb-2 group-hover:text-primary-500 transition-colors">
                            {{ project.title }}
                        </h3>
                        <p class="text-slate-600 dark:text-slate-400 text-sm line-clamp-3">
                            {{ project.description }}
                        </p>
                    </div>

                    <!-- Technologies -->
                    <div class="flex flex-wrap gap-2">
                        <span *ngFor="let tech of project.technologies" class="tag text-xs">
                            {{ tech }}
                        </span>
                    </div>

                    <!-- Links -->
                    <div class="flex items-center gap-4 pt-4 border-t border-slate-200 dark:border-slate-700">
                        <a *ngIf="project.githubUrl" [href]="project.githubUrl" target="_blank"
                            rel="noopener noreferrer"
                            class="flex items-center gap-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-primary-500 transition-colors">
                            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                                <path fill-rule="evenodd"
                                    d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"
                                    clip-rule="evenodd" />
                            </svg>
                            Code
                        </a>

                        <a *ngIf="project.liveUrl" [href]="project.liveUrl" target="_blank" rel="noopener noreferrer"
                            class="flex items-center gap-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:text-primary-500 transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                            </svg>
                            Live Demo
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Empty state -->
        <div *ngIf="!projects || projects.length === 0" class="text-center py-12 text-slate-500 dark:text-slate-400">
            <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
            </svg>
            <p>No projects available</p>
        </div>
    </div>
</section>
