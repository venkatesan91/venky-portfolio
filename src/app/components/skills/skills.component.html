<section id="skills" class="section bg-slate-50 dark:bg-slate-800">
    <div class="container-custom">
        <div class="text-center mb-16 reveal">
            <h2 class="text-4xl md:text-5xl font-bold text-slate-900 dark:text-white mb-4">
                Skills & Technologies
            </h2>
            <div class="w-20 h-1 bg-primary-500 mx-auto rounded-full"></div>
            <p class="mt-4 text-lg text-slate-600 dark:text-slate-400 max-w-2xl mx-auto">
                Technologies and tools I work with
            </p>
        </div>

        <div class="max-w-5xl mx-auto space-y-8">
            <div *ngFor="let category of skillCategories; let i = index"
                class="reveal bg-white dark:bg-slate-900 rounded-xl p-6 md:p-8 shadow-lg"
                [style.animation-delay]="(i * 0.1) + 's'">

                <h3 class="text-xl md:text-2xl font-bold text-slate-900 dark:text-white mb-6 flex items-center gap-3">
                    <span class="w-2 h-8 bg-primary-500 rounded-full"></span>
                    {{ category.category }}
                </h3>

                <div class="flex flex-wrap gap-3">
                    <span *ngFor="let skill of category.skills; let j = index"
                        class="px-4 py-2 bg-slate-50 dark:bg-slate-800 text-slate-700 dark:text-slate-300 rounded-lg font-medium 
                       hover:bg-primary-500 hover:text-white transition-all duration-300 hover:scale-105 cursor-default"
                        [style.animation-delay]="((i * 0.1) + (j * 0.05)) + 's'">
                        {{ skill }}
                    </span>
                </div>
            </div>
        </div>

        <!-- Empty state -->
        <div *ngIf="!skillCategories || skillCategories.length === 0"
            class="text-center py-12 text-slate-500 dark:text-slate-400">
            <svg class="w-16 h-16 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <p>No skills data available</p>
        </div>
    </div>
</section>
